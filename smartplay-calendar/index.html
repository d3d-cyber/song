<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPLAY 活動月曆 2026</title>
<style>
:root{--orange:#e8630a;--bg:#f6f5f2;--card:#fff;--ink:#222;--mut:#8a8578;--line:#e5e1d8;
      --green:#2e7d32;--blue:#1565c0;--teal:#00838f;--grey:#9e9e9e;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:3px solid var(--orange);padding:10px 14px;position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
header h1{font-size:18px;margin-right:6px}
header h1 small{color:var(--mut);font-weight:400;font-size:11.5px;margin-left:6px}
#q{flex:1 1 200px;min-width:160px;padding:8px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;outline:none}
#q:focus{border-color:var(--orange)}

/* combobox */
.combo{position:relative;min-width:130px}
.combo-in{width:100%;padding:8px 26px 8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;background:#fff;outline:none}
.combo-in:focus{border-color:var(--orange)}
.combo:after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.combo-list{display:none;position:absolute;top:calc(100% + 3px);left:0;right:0;max-height:260px;overflow:auto;
  background:#fff;border:1.5px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.13);z-index:99}
.combo-list.open{display:block}
.combo-opt{padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-opt:hover{background:#fff3e8}
.combo-opt.sel{background:#ffedd9;font-weight:600}
.combo-opt.none{color:var(--mut);cursor:default}

label.ck{display:flex;align-items:center;gap:5px;font-size:13px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;user-select:none}
label.ck input{accent-color:var(--orange);width:15px;height:15px}
.wd{display:flex;gap:4px;align-items:center}
.wd button{padding:7px 10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:#555}
.wd button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.wd button.qk{font-size:12px;color:var(--orange);border-color:var(--orange)}
.tabs{display:flex;gap:6px}
.tab{padding:7px 13px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.tab.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
#reset{padding:7px 13px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:14px}
.meta{color:var(--mut);font-size:12.5px;margin:2px 0 10px;display:flex;flex-wrap:wrap;gap:6px 16px}
#cycle{color:var(--orange);font-weight:600}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);background:#efede7;font-size:12.5px;color:#6d675a}
.calhead div{padding:7px 6px;text-align:center;font-weight:600}
.calhead div.dim{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:96px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:4px 5px;font-size:12px;cursor:pointer}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:#fff7ef}
.cell.blank{background:#fafaf8;cursor:default}
.cell.dim{background:#f2f0ea}
.cell.dim .chip{display:none}
.cell.sel{outline:2px solid var(--orange);outline-offset:-2px}
.cell.today .dnum{background:var(--orange);color:#fff}
.dnum{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-weight:600;margin-bottom:3px}
.chip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 5px;margin:2px 0;color:#fff;font-size:11px;line-height:16px}
.chip.full{opacity:.45;text-decoration:line-through}
.more{color:var(--mut);font-size:11px}
.daytitle{font-size:16px;font-weight:700;margin:14px 0 8px;padding-left:8px;border-left:4px solid var(--orange)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px}
.card h3{font-size:14.5px;margin-bottom:2px}
.card .en{color:var(--mut);font-size:12px;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:4px 14px;color:#444;margin:2px 0;align-items:baseline}
.row b{color:#111;font-weight:600}
.badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11.5px;color:#fff;margin-right:4px}
.b-ok{background:var(--green)}.b-fc{background:var(--blue)}.b-full{background:var(--grey)}
.b-teal{background:var(--teal)}.b-hot{background:var(--orange)}.b-dim{background:#b9b4a7}
.fee{float:right;color:var(--orange);font-weight:700;font-size:15px}
.seatline{margin-top:5px;font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--mut)}
footer{color:var(--mut);font-size:11.5px;text-align:center;padding:18px}
footer a{color:var(--blue)}
@media(max-width:760px){.cell{min-height:60px}.chip{display:none}.hrow{gap:6px}.combo{min-width:110px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🏃 SmartPLAY 活動月曆 <small>康樂及文化事務署 · 未登入公開資料</small></h1>
    <input id="q" type="search" placeholder="搜尋活動 / 地點 / 編號 / 教練…">
  </div>
  <div class="hrow">
    <span style="font-size:12.5px;color:#888">地區</span><div class="combo" id="c-dist"></div>
    <span style="font-size:12.5px;color:#888">場館</span><div class="combo" id="c-venue" style="min-width:200px"></div>
    <span style="font-size:12.5px;color:#888">類型</span><div class="combo" id="c-type" style="min-width:150px"></div>
    <span style="font-size:12.5px;color:#888">報名</span><div class="combo" id="c-meth" style="min-width:110px"></div>
  </div>
  <div class="hrow">
    <span style="font-size:12.5px;color:#888">開始時間</span>
    <div class="combo" id="c-t0" style="min-width:92px"></div>
    <span style="font-size:12.5px;color:#888">至</span>
    <div class="combo" id="c-t1" style="min-width:92px"></div>
    <div class="wd" id="wd"></div>
    <label class="ck"><input type="checkbox" id="notstarted">只顯示未開始</label>
    <label class="ck"><input type="checkbox" id="seats">只顯示有位</label>
  </div>
  <div class="hrow">
    <div class="tabs" id="vtab">
      <button class="tab on" data-v="cal">月曆</button>
      <button class="tab" data-v="list">清單</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <button id="reset">重設</button>
  </div>
</header>
<main>
  <div class="meta">
    <span id="meta"></span>
    <span id="stamp"></span>
    <span id="cycle"></span>
  </div>
  <div id="view-cal">
    <div class="cal">
      <div class="calhead" id="calhead"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div id="daylist"></div>
  </div>
  <div id="view-list" style="display:none"></div>
</main>
<footer>資料來源：SmartPLAY (lcsd.gov.hk) 公開搜尋 · 未登入擷取 · 報名前請以<a href="https://www.smartplay.lcsd.gov.hk" target="_blank">官方網站</a>為準</footer>
<script src="data.js"></script>
<script>
const D = window.SP_DATA, DATA = D.acts, TODAY = D.today;
const WK = {MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6,SUN:0};
const WD = "日一二三四五六";
let view = {y:2026,m:9}, selDay = null, listView = false;

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const venueName = a => a.vn ? a.vn+" ("+a.vc+")" : (a.vc || "-");
const typeName = a => (D.types && D.types[a.ty]) ? D.types[a.ty] : (a.ty || "");

/* ---------- searchable combobox ---------- */
function combo(hostId, hiddenId, placeholder, onChange){
  const host = document.getElementById(hostId);
  host.innerHTML = `<input type="hidden" id="${hiddenId}" value="">
    <input class="combo-in" placeholder="${placeholder}" autocomplete="off">
    <div class="combo-list"></div>`;
  const hidden = host.querySelector("input[type=hidden]");
  const input = host.querySelector(".combo-in");
  const list = host.querySelector(".combo-list");
  let opts = [];                       // [value, label]
  function renderList(q){
    q = (q||"").trim().toLowerCase();
    const match = opts.filter(([v,l]) => !q || l.toLowerCase().includes(q) || v.toLowerCase().includes(q));
    list.innerHTML = match.slice(0,400).map(([v,l]) =>
      `<div class="combo-opt${v===hidden.value?" sel":""}" data-v="${esc(v)}">${esc(l)}</div>`).join("")
      + (match.length===0 ? '<div class="combo-opt none">沒有符合</div>' : "");
    list.classList.add("open");
    list.querySelectorAll(".combo-opt[data-v]").forEach(o=>{
      o.onclick = ()=>{ hidden.value = o.dataset.v; input.value = o.textContent;
        list.classList.remove("open"); onChange(); };
    });
  }
  input.addEventListener("focus", ()=>renderList(input.value));
  input.addEventListener("input", ()=>renderList(input.value));
  input.addEventListener("keydown", e=>{
    if (e.key==="Enter"){ const f=list.querySelector(".combo-opt[data-v]"); if(f){f.click();} e.preventDefault(); }
    if (e.key==="Escape"){ list.classList.remove("open"); }
  });
  document.addEventListener("click", e=>{ if(!host.contains(e.target)) list.classList.remove("open"); });
  return {
    setOptions(o){ opts = o; },                     // [[value,label]]
    set(v){ const f = opts.find(o=>o[0]===v); hidden.value = v||""; input.value = f?f[1]:""; },
    get(){ return hidden.value; },
    clear(){ hidden.value=""; input.value=""; },
    fire(){ onChange(); }
  };
}

const CB = {};
["dist","venue","meth","type","t0","t1"].forEach(k=>{
  CB[k] = combo("c-"+k, "f-"+k, {dist:"全部地區",venue:"全部場館（可搜尋）",meth:"全部報名方式",
                                 type:"全部活動類型",t0:"06:00",t1:"22:30"}[k], render);
});
CB.t0.setOptions([...(function(){const a=[];for(let t=360;t<=1350;t+=30)a.push([String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"),1]);return a})()].map(x=>x[0]).map(v=>[v,v]));
CB.t1.setOptions(CB.t0 === null ? [] : [...(function(){const a=[];for(let t=360;t<=1350;t+=30)a.push([String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"),1]);return a})()].map(x=>x[0]).map(v=>[v,v]));
CB.t0.set("06:00"); CB.t1.set("22:30");
CB.meth.setOptions([["","全部報名方式"],["FCFS","先到先得"],["BALLOT","抽籤"],["WALKIN","即場報名"]].slice(1));
CB.dist.setOptions([["","全部地區"]]);

/* district options */
(function(){
  const groups = {};
  DATA.forEach(a=>{if(a.dist && !(a.dist in groups)) groups[a.dist]=1});
  const order = ["中西區","東區","南區","灣仔區","九龍城區","觀塘區","深水埗區","黃大仙區","油尖旺區",
                 "北區","西貢區","沙田區","大埔區","離島區","葵青區","荃灣區","屯門區","元朗區"];
  const o = [["","全部地區"]];
  order.forEach(d=>{if(groups[d])o.push([d,d])});
  Object.keys(groups).forEach(d=>{ if(!order.includes(d)) o.push([d,d]) });
  CB.dist.setOptions(o);
})();
/* venue options (respect district, searchable) */
function venueOptions(){
  const dist = CB.dist.get();
  const m = new Map();
  DATA.forEach(a=>{
    if (dist && a.dist!==dist) return;
    if (!a.vc) return;
    const lbl = a.vn ? a.vn+" ("+a.vc+")" : a.vc;
    if (!m.has(a.vc)) m.set(a.vc, lbl);
  });
  const o = [["","全部場館（可搜尋）"]];
  [...m.entries()].sort((x,y)=>{
    const px = x[1].includes(" (")?0:1, py = y[1].includes(" (")?0:1;
    return px-py || x[1].localeCompare(y[1],"zh-hk");
  }).forEach(([v,l])=>o.push([v,l]));
  CB.venue.setOptions(o);
}
/* type options */
(function(){
  const present = new Set(DATA.map(a=>a.ty).filter(Boolean));
  const o = [["","全部活動類型"]];
  Object.keys(D.types||{}).forEach(c=>{ if(present.has(c)) o.push([c, (D.types[c]||c)+" ("+c+")"]) });
  present.forEach(c=>{ if(!(D.types||{})[c]) o.push([c,c]) });
  CB.type.setOptions(o);
})();

/* weekday buttons + quick 平日/週末 */
(function(){
  ["一","二","三","四","五","六","日"].forEach((lbl,i)=>{
    const b = document.createElement("button");
    b.textContent = lbl; b.dataset.wd = (i+1)%7;
    b.onclick = ()=>{b.classList.toggle("on");render()};
    $("#wd").appendChild(b);
  });
  const qd = document.createElement("button");
  qd.textContent = "平日"; qd.className = "qk";
  qd.onclick = ()=>{ document.querySelectorAll("#wd button").forEach(x=>{
      const w = +x.dataset.wd; x.classList.toggle("on", w>=1 && w<=5); }); render(); };
  const qe = document.createElement("button");
  qe.textContent = "週末"; qe.className = "qk";
  qe.onclick = ()=>{ document.querySelectorAll("#wd button").forEach(x=>{
      const w = +x.dataset.wd; x.classList.toggle("on", w===0 || w===6); }); render(); };
  $("#wd").appendChild(qd); $("#wd").appendChild(qe);
})();
function selWeekdays(){
  const s = new Set();
  document.querySelectorAll("#wd button.on[data-wd]").forEach(b=>s.add(+b.dataset.wd));
  return s;
}

$("#reset").onclick = ()=>{
  $("#q").value="";
  ["dist","venue","meth","type"].forEach(k=>CB[k].clear());
  CB.t0.set("06:00"); CB.t1.set("22:30");
  $("#notstarted").checked=false; $("#seats").checked=false;
  document.querySelectorAll("#wd button").forEach(b=>b.classList.remove("on"));
  selDay=null; render();
};
document.querySelectorAll("#vtab .tab").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("#vtab .tab").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); listView = b.dataset.v==="list"; render();
  };
});

/* ---------- matching ---------- */
function passes(a){
  const q = $("#q").value.trim().toLowerCase(), d = CB.dist.get(), v = CB.venue.get(),
        m = CB.meth.get(), ty = CB.type.get();
  if (d && a.dist!==d) return false;
  if (v && a.vc!==v) return false;
  if (m && a.m!==m) return false;
  if (ty && a.ty!==ty) return false;
  if (q){
    const hay = (a.tc+" "+a.en+" "+a.no+" "+(a.vn||"")+" "+a.vc+" "+typeName(a)+" "+(a.ins||[]).join(" ")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const t0 = CB.t0.get() || "06:00", t1 = CB.t1.get() || "22:30";
  if (a.st && (a.st < t0 || a.st > t1)) return false;
  if ($("#notstarted").checked && a.sd < TODAY) return false;
  if ($("#seats").checked && !((a.ql>0) || (a.fq>0))) return false;
  const wds = selWeekdays();
  if (wds.size){
    let hit = false;
    if (a.wk.length) a.wk.forEach(w=>{ if (WK[w]!==undefined && wds.has(WK[w])) hit = true; });
    else { const wd = new Date(a.sd+"T00:00:00").getDay(); if (wds.has(wd)) hit = true; }
    if (!hit) return false;
  }
  return true;
}
function covers(a, day){
  const ds = fmt(day);
  if (ds < a.sd || ds > a.ed) return false;
  if (a.ex && a.ex.includes(ds)) return false;
  if (a.wk && a.wk.length) return a.wk.some(w=>WK[w]===day.getDay());
  return ds === a.sd;
}

/* ---------- seats & enrol state ---------- */
function seatBadge(a){
  if (a.ql > 0) return `<span class="badge b-ok">有位 · 餘${a.ql}</span>`;
  if (a.fq > 0) return `<span class="badge b-teal">後補有位 · 餘${a.fq}</span>`;
  return `<span class="badge b-full">額滿</span>`;
}
function phase(a){
  const t = TODAY;
  if (a.m === "BALLOT"){
    if (a.esd && a.eed) return {txt:`抽籤報名 ${a.esd} → ${a.eed}`, on: t>=a.esd && t<=a.eed, past: t>a.eed};
    return {txt:"", on:false, past:false};
  }
  const s = a.fsd || a.esd, e = a.fed || a.eed;
  if (s && e) return {txt:`報名 ${s} → ${e}`, on: t>=s && t<=e, past: t>e};
  return {txt:"", on:false, past:false};
}
function enrolBadges(a){
  let h = "";
  const p = phase(a);
  if (a.now) h += `<span class="badge b-hot">現可報名</span>`;
  else if (p.on) h += `<span class="badge b-hot">報名中</span>`;
  else if (p.past && a.m==="BALLOT" && (a.ql>0 || a.fq>0) && (!a.fsd || TODAY<=a.fed))
    h += `<span class="badge b-teal">抽籤後可後補</span>`;
  else if (p.past) h += `<span class="badge b-dim">已截止</span>`;
  else if (p.txt) h += `<span class="badge b-dim">未開始</span>`;
  return h;
}

/* ---------- views ---------- */
function renderTabs(){
  const tabs = $("#tabs"); tabs.innerHTML = "";
  [[2026,9],[2026,10],[2026,11],[2026,12]].forEach(([y,m])=>{
    const b = document.createElement("button");
    b.className = "tab"+(view.y===y&&view.m===m?" on":"");
    b.textContent = `${y}年${m}月`;
    b.onclick = ()=>{view={y,m};selDay=null;render()}; tabs.appendChild(b);
  });
}
function render(){
  renderTabs(); venueOptions();
  const F = DATA.filter(passes);
  $("#stamp").textContent = "資料更新：" + (D.updated||"") + " · 共 " + DATA.length + " 項活動";
  const bal = DATA.filter(a=>a.m==="BALLOT" && a.fsd && a.fsd >= TODAY);
  if (bal.length){
    const cnt = {};
    bal.forEach(a=>{const k=a.esd+" → "+a.eed+"|"+a.fsd; cnt[k]=(cnt[k]||0)+1});
    const best = Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0][0].split("|");
    $("#cycle").textContent = "本期抽籤班報名 " + best[0] + " · 繳費確認自 " + best[1] +
      " 起 — 未繳費名額屆時釋出（先到先得）";
  } else { $("#cycle").textContent = ""; }
  $("#view-cal").style.display = listView ? "none" : "block";
  $("#view-list").style.display = listView ? "block" : "none";
  if (listView) renderList(F); else renderCal(F);
}
function renderCal(F){
  const wds = selWeekdays();
  const heads = $("#calhead").children;
  for (let i=0;i<7;i++) heads[i].classList.toggle("dim", wds.size && !wds.has((i+1)%7));
  const first = new Date(view.y,view.m-1,1), last = new Date(view.y,view.m,0);
  const out = {}; for (let d=1; d<=last.getDate(); d++) out[d]=[];
  for (const a of F){
    const s = new Date(a.sd+"T00:00:00"), e = new Date(a.ed+"T00:00:00");
    if (e < first || s > last) continue;
    for (let d=1; d<=last.getDate(); d++){
      const day = new Date(view.y,view.m-1,d);
      if (wds.size && !wds.has(day.getDay())) continue;   // strict weekday view
      if (covers(a,day)) out[d].push(a);
    }
  }
  const cnt = new Set(); Object.values(out).forEach(v=>v.forEach(a=>cnt.add(a.no+a.sd)));
  $("#meta").textContent = `顯示 ${view.y}年${view.m}月 — ${cnt.size} 項活動、${Object.values(out).reduce((s,v)=>s+v.length,0)} 個活動日（點日期看詳情）`;
  const lead = (first.getDay()+6)%7;
  const today = fmt(new Date());
  let html = "";
  for (let i=0;i<lead;i++) html += '<div class="cell blank"></div>';
  for (let d=1; d<=last.getDate(); d++){
    const list = out[d];
    const ds = `${view.y}-${String(view.m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayWd = new Date(view.y,view.m-1,d).getDay();
    let chips = list.slice(0,4).map(a=>
      `<span class="chip${a.ql<=0&&a.fq<=0?" full":""}" style="background:${a.ql>0?"var(--green)":a.fq>0?"var(--teal)":"var(--grey)"}" title="${esc(a.tc)}">${esc(a.tc)}</span>`).join("");
    if (list.length>4) chips += `<span class="more">+${list.length-4} 更多</span>`;
    html += `<div class="cell${ds===today?" today":""}${selDay===d?" sel":""}${wds.size&&!wds.has(dayWd)?" dim":""}" data-d="${d}">
               <span class="dnum">${d}</span>${chips}</div>`;
  }
  $("#grid").innerHTML = html;
  document.querySelectorAll(".cell[data-d]").forEach(el=>{
    el.onclick = ()=>{selDay=+el.dataset.d;render();renderDay(selDay,F);
      $("#daylist").scrollIntoView({behavior:"smooth",block:"nearest"})};
  });
  renderDay(selDay, F);
}
function renderDay(d, F){
  const box = $("#daylist");
  if (!d){box.innerHTML="";return}
  const day = new Date(view.y,view.m-1,d);
  const wds = selWeekdays();
  const blocked = wds.size && !wds.has(day.getDay());
  const list = blocked ? [] : F.filter(a=>covers(a,day)).sort((a,b)=>(a.st||"").localeCompare(b.st||""));
  const wd = WD[day.getDay()];
  const hint = blocked ? " — 不在你選擇的日子內" : "";
  box.innerHTML = `<div class="daytitle">${view.y}年${view.m}月${d}日 (星期${wd}) — ${list.length} 項活動${hint}</div>`+
    (list.length?`<div class="cards">${list.map(card).join("")}</div>`:'<div class="empty">沒有活動</div>');
}
function renderList(F){
  const s = F.slice().sort((a,b)=>a.sd.localeCompare(b.sd)||(a.st||"").localeCompare(b.st||""));
  const cap = s.slice(0,300);
  $("#meta").textContent = `清單 — 共 ${s.length} 項符合${s.length>300?"（顯示首300）":""}，按開始日期排序`;
  $("#view-list").innerHTML = cap.length
    ? `<div class="cards">${cap.map(card).join("")}</div>`
    : '<div class="empty">沒有符合的活動 — 試試放寬篩選</div>';
}
function card(a){
  const st = (a.st||"").slice(0,5), et = (a.et||"").slice(0,5);
  const meth = a.m==="FCFS" ? '<span class="badge b-fc">先到先得</span>'
             : a.m==="BALLOT" ? '<span class="badge" style="background:var(--blue)">抽籤</span>'
             : a.m==="WALKIN" ? '<span class="badge b-dim">即場</span>' : "";
  const p = phase(a);
  return `<div class="card">
    <span class="fee">${a.fee==null||a.fee===0?"免費":"$"+a.fee}</span>
    <h3>${esc(a.tc)}</h3><div class="en">${esc(a.en)}</div>
    <div class="row">${meth}${seatBadge(a)}${enrolBadges(a)}<span class="badge b-dim">${esc(typeName(a))}</span></div>
    <div class="row"><b>${esc(a.no)}</b></div>
    <div class="row">📅 ${a.sd} → ${a.ed}${a.les?` (${a.les}節)`:''}</div>
    <div class="row">⏰ ${st}–${et}　📍 ${esc(venueName(a))}</div>
    <div class="row">👥 名額 ${a.q}　🎂 ${esc(a.age||"-")}　👤 ${esc((a.ins||[]).join("、")||"-")}</div>
    ${p.txt?`<div class="row seatline">${esc(p.txt)}${p.on?' <b style="color:var(--orange)">（進行中）</b>':""}</div>`:""}
  </div>`;
}
$("#q").addEventListener("input", render);
$("#notstarted").addEventListener("change", render);
$("#seats").addEventListener("change", render);
render();
</script>
</body>
</html>
